# Hardware presets for Crosscheck.
#
# CPU performance is given as a target score of the bundled calibration benchmark
# (1000 = one mid-range desktop core from 2024), not as a percentage. hostd converts the
# score into a CPU quota and core count per host. "max" means: whatever the host can give.
#
# Security: gpu "virgl" and "passthrough", nested virtualisation (Android) and cloud burst are
# bound to trust classes in the admin policy. When a class is not allowed, gpu falls back to
# "software" and the report records the downgrade.

version: 1

presets:
  potato:
    description: "Ten-year-old laptop, netbook"
    cpu: { cores: 2, score: 300, model: x86-64-v2-AES, flags: ["-avx2", "-avx512f", "-fma"] }
    memory_mb: 4096
    disk: { mbps_read: 80, mbps_write: 60, iops_read: 120, iops_write: 100 }
    gpu: software
    display: { width: 1366, height: 768, scale: 100 }
    network: 3g

  office:
    description: "Typical office or library PC"
    cpu: { cores: 2, score: 550, model: x86-64-v2-AES, flags: ["-avx512f"] }
    memory_mb: 8192
    disk: { mbps_read: 400, mbps_write: 300, iops_read: 20000, iops_write: 15000 }
    gpu: software
    display: { width: 1920, height: 1080, scale: 100 }
    network: busy-wifi

  mainstream:
    description: "Current mid-range laptop"
    cpu: { cores: 4, score: 1000, model: x86-64-v3 }
    memory_mb: 16384
    disk: { mbps_read: 1500, mbps_write: 1000 }
    gpu: software
    display: { width: 1920, height: 1080, scale: 125 }
    network: dsl

  highend:
    description: "Current good desktop"
    cpu: { cores: 8, score: 1400, model: host }
    memory_mb: 32768
    disk: unthrottled
    gpu: [virgl, software]         # first allowed option wins
    display: { width: 2560, height: 1440, scale: 125 }
    network: fibre

  insane:
    description: "Top-end workstation. Exposes races and HiDPI bugs"
    cpu: { cores: max, score: max, model: host }
    memory_mb: max                 # capped by host.max_vm_memory_mb
    disk: unthrottled
    tmp_on_ramdisk: true
    gpu: [passthrough, virgl, software]
    display:
      - { width: 3840, height: 2160, scale: 150 }
      - { width: 1920, height: 1080, scale: 100 }
    network: lan
    when_unreachable: [simulated-traits, extrapolated, cloud-burst]   # see docs/14

  phone-budget:
    platforms: [android]
    description: "Entry-level Android phone"
    emulator: { cores: 4, score: 350, memory_mb: 2048, gpu: swiftshader }
    display: { width: 720, height: 1600, dpi: 320 }
    network: 3g

  phone-flagship:
    platforms: [android, ios]
    description: "Current flagship phone"
    emulator: { cores: 8, score: max, memory_mb: 12288, gpu: host }
    ios_device: "newest iPhone Pro Max"
    display: { width: 1440, height: 3120, dpi: 560 }
    network: 5g

networks:
  # Applied by the per-run egress proxy.
  offline:    { loss_percent: 100 }
  3g:         { delay_ms: 300, jitter_ms: 100, rate_kbit: 1500, loss_percent: 2 }
  busy-wifi:  { delay_ms: 40, jitter_ms: 30, rate_kbit: 15000, loss_percent: 1 }
  dsl:        { delay_ms: 20, jitter_ms: 5, rate_kbit: 50000 }
  5g:         { delay_ms: 20, jitter_ms: 10, rate_kbit: 300000 }
  fibre:      { delay_ms: 5, rate_kbit: 500000 }
  lan:        {}

modifiers:
  offline:        { network: offline, from: app_start }
  flaky-net:      { network_flap: { up_s: 20, down_s: 5 } }
  thermal:        { cpu_schedule: [{ after_s: 0, factor: 1.0 }, { after_s: 30, factor: 0.4 }] }
  mem-pressure:   { balloon_fill_percent_of_free: 50, from: app_start }
  disk-full:      { free_disk_mb: 200 }
  battery-saver:  { power_profile: power-saver }
  dark:           { theme: dark }
  high-contrast:  { high_contrast: true, font_scale: 150 }
  rtl:            { locale: ar_EG.UTF-8 }
  pseudo-l10n:    { locale: qps-ploc, text_expansion_percent: 40 }
  wrong-clock:    { clock_offset_days: -730 }
  dst:            { timezone: Europe/Berlin, clock_set: "next_dst_change - 120s" }
