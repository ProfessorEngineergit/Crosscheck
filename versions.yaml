# Platform and toolchain versions per channel.
# A nightly job checks upstream and opens a PR on this file when something new appears.
# Crosscheck checks that PR itself: new templates are built, tested against the reference
# project, and only then activated.
#
# "auto" means: the newest stable version the version job found. The exact versions used
# are written to versions.lock after every template build.
# Comments name the state when this file was written (2026-09) for orientation only.

channels:
  latest:
    host:
      proxmox_ve: auto          # Proxmox VE 9.x on Debian 13
    linux:
      ubuntu: auto              # newest Ubuntu release, including non-LTS
      fedora: auto
      debian: auto
      session: [x11, wayland]
    windows:
      windows_11: auto          # newest feature update, evaluation ISO or own licence
    android:
      api_level: auto           # highest stable API level in the SDK
      system_image: google_apis_playstore
    apple:
      macos: auto
      xcode: auto
      ios_simulator_runtime: auto
    web:
      playwright: auto          # ships matching Chromium, Firefox, WebKit
    toolchains:
      node: current
      python: auto
      rust: stable
      dotnet: auto
      jdk: auto                 # newest LTS
      flutter: stable
      go: auto

  lts:
    host:
      proxmox_ve: auto
    linux:
      ubuntu: lts               # Ubuntu 26.04 LTS
      debian: stable
      session: [x11, wayland]
    windows:
      windows_11: auto
    android:
      api_level: auto-minus-1
    apple:
      macos: auto-minus-1
      xcode: auto
    toolchains:
      node: lts
      python: auto-minus-1
      rust: stable
      dotnet: lts
      jdk: lts

  preview:
    optional: true
    android:
      api_level: preview
    apple:
      macos: beta
      xcode: beta
    windows:
      windows_11: insider-beta
    linux:
      ubuntu: devel
