[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crosscheck"
version = "0.1.0"
description = "Check every pull request on every platform and hardware class, in disposable VMs, from any chat session."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Crosscheck contributors" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "pyjwt[crypto]>=2.8",
  "mcp>=1.9",
  "uvicorn>=0.30",
  "starlette>=0.37",
  "anthropic>=0.40",
  "pycdlib>=1.14",
  "segno>=1.6",
  "pillow>=10.0",
  "anyio>=4.0",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
crosscheck = "crosscheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crosscheck"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/report.schema.json" = "crosscheck/data/report.schema.json"
"presets/hardware.yaml" = "crosscheck/data/hardware.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003", "RUF005", "RUF046", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
