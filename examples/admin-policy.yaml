# Export der Admin-Richtlinie. Liegt auf dem Controller, nicht im Repo.
# Die crosscheck.yaml eines Repos darf diese Werte nur verschärfen.

version: 1

topology:
  controller: separate-device        # separate-device | same-host
  runner_hosts:
    - name: runner-1
      kind: proxmox
      dedicated: true                # keine anderen VMs auf diesem Host
      reimage: weekly                # never | weekly | nightly | after-untrusted-run
      ksm: off
      smt: on                        # off für maximale Seitenkanal-Härtung
  mac_host:
    name: mac-mini
    kind: tart
    classes: [maintainer, vertraut]  # macOS/iOS nur für diese Klassen

classes:
  vertraut:
    users: [freundin-aus-der-ag, lehrer-account]
    teams: [myorg/core]
  gesperrt:
    users: []
  bot:
    apps: [dependabot, renovate]

defaults:
  static: { mode: alle }
  smoke:
    mode: klassen
    classes: [maintainer, vertraut]
    others: approved
  deep: { mode: manuell }

repos:
  ProfessorEngineergit/myapp:
    smoke: { mode: alle }            # öffentliches Projekt, jeder PR wird geprüft
  ProfessorEngineergit/schulprojekt:
    smoke: { mode: approved }

limits:
  maintainer: { platforms: all, presets: all, max_minutes: 60, parallel: 2, per_day: unlimited, hold: true,  gpu: [virgl, passthrough], egress_observe: true }
  vertraut:   { platforms: all, presets: 3,   max_minutes: 45, parallel: 1, per_day: 30,        hold: true,  gpu: [],                   egress_observe: false }
  bekannt:    { platforms: 2,   presets: 2,   max_minutes: 30, parallel: 1, per_day: 10,        hold: false, gpu: [],                   egress_observe: false }
  fremd:      { platforms: 1,   presets: 1,   max_minutes: 20, parallel: 1, per_day: 5,         hold: false, gpu: [],                   egress_observe: false }
  bot:        { platforms: 1,   presets: 1,   max_minutes: 20, parallel: 1, per_day: 20,        hold: false, gpu: [],                   egress_observe: false }

deep:
  allowed_requesters: [maintainer]
  second_confirmation_for: [fremd, bot]
  monthly_budget_eur: 20

retention:
  reports_days: 90
  screenshots_days: 30
  videos_days: 7
  logs_days: 14
  build_artifacts_days: 0            # 0 = sofort nach dem Lauf löschen
  untrusted_runs_keep_nothing: false # true: nur Status und Findings bleiben, keine Medien

admin_ui:
  listen: [lan, tailscale]           # nie über den öffentlichen Tunnel
  auth: passkey
  reconfirm_on_policy_change: true
